replicaCount: 3

image:
  repository: ghcr.io/change-me/ping-pong
  tag: dev
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: traefik

  annotations: {}

  hosts:
    - host: ping-pong.localhost
      paths:
        - path: /
          pathType: Prefix

  tls: []

resources:
  requests:
    cpu: 50m
    memory: 32Mi

  limits:
    cpu: 250m
    memory: 128Mi

probes:
  startup:
    periodSeconds: 2
    timeoutSeconds: 1
    failureThreshold: 10

  readiness:
    periodSeconds: 3
    timeoutSeconds: 1
    failureThreshold: 2

  liveness:
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3

autoscaling:
  enabled: true

  minReplicas: 3
  maxReplicas: 6

  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 2

terminationGracePeriodSeconds: 30

arm64:
  preferred: true

topologySpread:
  enabled: true